# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # required to push tags

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#    - name: Lint with ruff
#      run: |
#        ruff check .
    - name: Get crane curves
      env:
        TOKEN: ${{ secrets.crane_curves_token }}
      run: |
        curl -H "Authorization: token ${TOKEN}" https://raw.githubusercontent.com/akjore/crane_curves/refs/heads/main/crane_curves.yaml -o crane_curves.yaml
    - name: Test with pytest
      env:
        CRANE_CURVE_FILENAME: "crane_curves.yaml"
      run: |
        pytest
    - name: Build
      run: |
        python -m pip install --user --upgrade build
        python -m build
    - name: Configure Git
      run: |
        git config --global user.email "akjore@outlook.com"
        git config --global user.name "akj"
    - name: Commit and push wheel
      if: ${{ matrix.python-version == '3.14' }}
      run: |
        git add -f ./dist/*.whl
        git commit -m 'pushing new wheel'
        git push

  tag:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Generate tag
        id: tagger
        run: |
          # Today's date
          DATE=$(date +'%Y.%m.%d')
          echo "DATE=$DATE"

          # Find existing tags for today
          MATCHING_TAGS=$(git tag -l "${DATE}*")

          echo "Existing tags:"
          echo "$MATCHING_TAGS"

          if [ -z "$MATCHING_TAGS" ]; then
            TAG="$DATE"
          else
            # Extract suffix numbers
            MAX_N=0

            for tag in $MATCHING_TAGS; do
              if [[ "$tag" =~ ^${DATE}-([0-9]+)$ ]]; then
                n="${BASH_REMATCH[1]}"
                if (( n > MAX_N )); then
                  MAX_N=$n
                fi
              elif [[ "$tag" == "$DATE" ]]; then
                if (( MAX_N < 0 )); then
                  MAX_N=0
                fi
              fi
            done

            NEXT_N=$((MAX_N + 1))
            TAG="${DATE}-${NEXT_N}"
          fi

          echo "New tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.tagger.outputs.tag }}

      - name: Push tag
        run: |
          git push origin ${{ steps.tagger.outputs.tag }}

 
          

        
