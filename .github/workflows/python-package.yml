# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#    - name: Lint with ruff
#      run: |
#        ruff check .
    - name: Get crane curves
      env:
        TOKEN: ${{ secrets.crane_curves_token }}
      run: |
        curl -H "Authorization: token ${TOKEN}" https://raw.githubusercontent.com/acct/crane_curves/main/crane_curves.yaml
    - name: Test with pytest
      env:
        CRANE_CURVE_FILENAME: "crane_curves.yaml"
      run: |
        pytest
    - name: Build
      run: |
        python -m pip install --user --upgrade build
        python -m build
    - name: Configure Git
      run: |
        git config --global user.email "akjore@outlook.com"
        git config --global user.name "akj"
    - name: Commit and push wheel
      if: ${{ matrix.python-version == '3.14' }}
      run: |
        git add -f ./dist/*.whl
        git commit -m 'pushing new wheel'
        git push
        
