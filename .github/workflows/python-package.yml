# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # required to push commits and tags

jobs:

# --------------------------------------------------
# 1. TEST (matrix)
# --------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#    - name: Lint with ruff
#      run: |
#        ruff check .
    - name: Get crane curves
      env:
        TOKEN: ${{ secrets.crane_curves_token }}
      run: |
        curl -H "Authorization: token ${TOKEN}" \
          https://raw.githubusercontent.com/akjore/crane_curves/refs/heads/main/crane_curves.yaml -o crane_curves.yaml

    - name: Run tests
      env:
        CRANE_CURVE_FILENAME: "crane_curves.yaml"
      run: |
        pytest


# --------------------------------------------------
# 2. BUILD + PUBLISH WHEEL
# --------------------------------------------------
  build_publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --user --upgrade build

      - name: Build wheel
        run: |
          python -m build

      - name: Configure Git
        run: |
          git config --global user.email "akjore@outlook.com"
          git config --global user.name "akj"

      - name: Commit and push wheel
        run: |
          mkdir -p wheels
          rm -f wheels/*.whl
          cp dist/*.whl wheels/

          git add wheels/*.whl
          git commit -m "build: wheel for ${{ github.sha }}" || echo "No changes"
          git push origin main


# --------------------------------------------------
# 3. TAG (versioning only)
# --------------------------------------------------
  tag:
    needs: build_publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      tag: ${{ steps.tagger.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "akjore@outlook.com"
          git config --global user.name "akj"

      - name: Sync repo
        run: git pull origin main

      - name: Fetch all tags
        run: git fetch --tags

      - name: Generate tag
        id: tagger
        run: |
          # Today's date
          DATE=$(date +'%Y.%m.%d')
          echo "DATE=$DATE"

          # Find existing tags for today
          MATCHING_TAGS=$(git tag -l "${DATE}*")

          echo "Existing tags:"
          echo "$MATCHING_TAGS"

          if [ -z "$MATCHING_TAGS" ]; then
            TAG="$DATE"
          else
            # Extract suffix numbers
            MAX_N=0

            for tag in $MATCHING_TAGS; do
              if [[ "$tag" =~ ^${DATE}-([0-9]+)$ ]]; then
                n="${BASH_REMATCH[1]}"
                if (( n > MAX_N )); then
                  MAX_N=$n
                fi
              elif [[ "$tag" == "$DATE" ]]; then
                if (( MAX_N < 0 )); then
                  MAX_N=0
                fi
              fi
            done

            NEXT_N=$((MAX_N + 1))
            TAG="${DATE}-${NEXT_N}"
          fi

          echo "New tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.tagger.outputs.tag }}

      - name: Write version file
        run: |
          echo "export const VERSION = '${{ steps.tagger.outputs.tag }}';" > webapp/js/version.js

      - name: Commit version file
        run: |
          git add webapp/js/version.js
          git commit -m "Update version ${{ steps.tagger.outputs.tag }}" || echo "No changes"

      - name: Push commit and tag
        run: |
          git push origin main
          git push origin ${{ steps.tagger.outputs.tag }}


# --------------------------------------------------
# 4. RELEASE ASSETS
# --------------------------------------------------
  release_assets:
    needs: tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Get crane curves
        env:
          TOKEN: ${{ secrets.crane_curves_token }}
        run: |
          curl -H "Authorization: token ${TOKEN}" \
            https://raw.githubusercontent.com/akjore/crane_curves/refs/heads/main/crane_curves.yaml \
            -o crane_curves.yaml

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            crane_curves.yaml
            wheels/*.whl
