%YAML 1.2
---
# Syntax (sample):
# Case id:
#    crane_curve_a: S7000.main.fixed_1.5
#    crane_curve_b: S7000.main.fixed_1.5
#    crane_radius_a: 50.0 m
#    crane_radius_b: 50.0 m
#    rigging_weight_a: 495 t
#    rigging_weight_b: 380 t
#    weight_uncertainty_factor: 1.03
#    cog_uncertainty_factor: 1.02
#    tilt_factor: 1.02
#    lift_point_a:
#     - (43.73+3.03) m 
#     - (43.73-3.03) m
#    lift_point_b: 82. m
#    weight: 10295 t
#    cog: 
#     -  61.668 m
#
# Case id: Any string describing the case. Remember the trailing colon
# crane_curve_a: Any valid crane curve
# crane_curve_b: Any valid crane curve. Will usually be the same as for crane a, but is not required to be.
# crane_radius_a: Any radius within the extremes of the crane curve
# crane_radius_b: As for crane_radius_a
# rigging_weight_a: The weight of the rigging associated with crane hook a
# rigging_weight_b: As for rigging_weight_a
# weight_uncertainty_factor: The weight uncertainty factor
# cog_uncertainty_factor: The cog uncertainty factor
# tilt_factor: The tilt factor
# lift_point_a: Either a single point, or two values if float is considered.
# lift_point_b: As for lift_point_a
# weight: The mass of the lifted object. The report will use this unit for mass.
# cog: The centre of gravity
#   if a single value is given then this is assumed to be the centre of gravity
#   if two values are given these are assumed to be the extremes of the lifting envelope
#   if three values are given the smallest and largest values are assumed to be the extremes of the lifting envelope,
#       and the remaining value that of the centre of gravity

# A reference case may be identified by an &-tag (yaml anchor tag)
Sample 1: &ref1
    crane_curve_a: S7000.main.fixed_1.5
    crane_curve_b: S7000.main.fixed_1.5
    crane_radius_a: 50.0 m
    crane_radius_b: 50.0 m
    rigging_weight_a: 495 t
    rigging_weight_b: 380 t
    weight_uncertainty_factor: 1.03
    cog_uncertainty_factor: 1.02
    tilt_factor: 1.02
    lift_point_a: [43.73 m]
    lift_point_b: [82. m]
    weight: 10295 t
    cog: 61.668 m

# A reference case may be re-used, and selected parameters overwritten (yaml alias tag)
Sample 2:
    <<: *ref1
    crane_curve_a: Thialf.main
    crane_curve_b: Thialf.main

# Specify two lifting points to indicate float
Sample 3:
    <<: *ref1
    lift_point_a:
     - (43.73+3.03) m 
     - (43.73-3.03) m

# Units given for weight anc CoG determine the units used on the plots
Sample 4:
    <<: *ref1
    weight: 226965.89892 slugs

# Which crane is A and which is B is not important
Sample 5:
    <<: *ref1
    lift_point_a: [82. m]
    lift_point_b: [43.73 m]
    rigging_weight_a: 380 t
    rigging_weight_b: 495 t

# If only CoG envelope is known, specify end points - simple arithmetic supported
Sample 6:
    <<: *ref1
    cog: [(61.668-1.5) m, (61.668+1.5)m ]

# Normally, however, 3 points are known (CoG and envelope)
Sample 7:
    <<: *ref1
    cog: [(61.668-1.5) m, 61.668m, (61.668+1.5)m ]

# The middle point is assumed to be the CoG, and may be outside the envelope
Sample 8:
    <<: *ref1
    cog: [(61.668-1.5) m, (61.668-2)m, (61.668+1.5)m ]

# Lists may either be represented as square brackets (Sample 7), or with hyphens:
Sample 9:
    <<: *ref1
    cog: 
    - (61.668-1.5)*3937/1200 survey_foot
    -  61.668m 
    - (61.668+1.5)m
