[build-system]
requires = [ "setuptools>=41", "wheel", "setuptools-git-versioning", ]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.html", "*.css", "*.template"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}.post{ccount}"

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = ["D203", "D213", "G004", "PLR2004", "PLR0913"]
line-length = 120

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[project]
name = "dual_crane_lift_capacity"
dynamic = ["version", "dependencies"]
authors = [
  { name="Arne Kristian Jore", email="akjore@outlook.com" },
]
description = "Prepares lift capacity curves for dual crane lifts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
# package name = entrypoint
# dual_crane_lift_capacity = "dual_crane_lift_capacity.__main__:main"

[project.urls]
"Homepage" = "https://github.com/akjore/dual_crane_lift_capacity"
"Bug Tracker" = "https://github.com/akjore/dual_crane_lift_capacity/issues"
